services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: controle_db
    ports:
      - '5433:5432'
    volumes:
      - controle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d controle_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  controle_postgres_data:

